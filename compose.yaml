services:
  url-service:
    build:
      dockerfile: /url-service/Dockerfile
    ports:
      - "8080:8080"
    container_name: URL_SERVICE
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/TEST?autoReconnect=true
      SPRING_DATASOURCE_USERNAME: default
      SPRING_DATASOURCE_PASSWORD: default
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
      SPRING_JPA_HIBERNATE_DDL-AUTO: none
    depends_on:
      - mysql

  url-ui-service:
    build:
      dockerfile: /url-ui-service/Dockerfile
    container_name: URL_UI_SERVICE
    ports:
      - "3000:80"

  mysql:
    image: mysql:9.0
    container_name: MYSQL_TPXTEST
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: TEST
      MYSQL_USER: default
      MYSQL_PASSWORD: default
    ports:
      - "9090:3306"
    volumes:
      - ./mysql-resources/mysql-data:/var/lib/mysql
      - ./mysql-resources/mysql-init:/docker-entrypoint-initdb.d