spring:
  application:
    name: url-service
  datasource:
    url: jdbc:mysql://mysql:3306/TEST?autoReconnect=true
    password: default
    username: default
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true